<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>igrid</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
<script>
  // Apply the saved theme before first paint.
  try { const t = localStorage.getItem('igrid-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<header id="bar"></header>
<div id="tagbar"></div>
<main id="main"></main>
<div id="dropveil"><div>Drop to add to this board</div></div>
<div id="selbar" hidden><span id="selcount"></span><button data-act="all">Select all</button><button data-act="top" data-needs>↑ Top</button><button data-act="bottom" data-needs>↓ Bottom</button><button data-act="move" data-needs title="Move to another board">Move to…</button><button data-act="delete" data-needs>Delete</button><button data-act="clear" title="Leave select mode (Esc)">Done</button></div>
<div id="toasts"></div>
<dialog id="ask"></dialog>
<dialog id="detail"></dialog>
<input type="file" id="filepick" accept="image/*" multiple hidden>
<script type="module" src="/app.js"></script>
</body>
</html>
